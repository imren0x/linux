%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/siliconmitus,sm5703-fuel-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5703 Fuel Gauge

maintainers:
  - Yumi Yukimura <me.cafebabe@gmail.com>

description:
  The fuel gauge of the SM5703 PMIC is a voltage tracking gauge on a separate
  I2C address. It needs battery specific tables and tuning parameters that are
  provided by the battery vendor.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: siliconmitus,sm5703-fuel-gauge

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  monitored-battery:
    description: Phandle to the monitored battery

  power-supplies:
    maxItems: 1
    description: Phandle to the charger of the PMIC

  siliconmitus,discharge-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 16
    maxItems: 16
    description: Battery voltage table for discharging

  siliconmitus,charge-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 16
    maxItems: 16
    description: Battery voltage table for charging

  siliconmitus,q-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 16
    maxItems: 16
    description: Battery capacity table

  siliconmitus,rce:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3

  siliconmitus,rs:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description: RS, RS mix factor, RS max, RS min

  siliconmitus,mix:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    description: Mix rate and mix init blank

  siliconmitus,topoff-soc:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    description: Enable flag and state of charge threshold for top-off

  siliconmitus,dtcd:
    $ref: /schemas/types.yaml#/definitions/uint32

  siliconmitus,vit-period:
    $ref: /schemas/types.yaml#/definitions/uint32

  siliconmitus,volt-cal:
    $ref: /schemas/types.yaml#/definitions/uint32

  siliconmitus,curr-cal:
    $ref: /schemas/types.yaml#/definitions/uint32

  siliconmitus,temp-std:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 25

  siliconmitus,temp-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 10

  siliconmitus,temp-offset-cal:
    $ref: /schemas/types.yaml#/definitions/int32

  siliconmitus,charge-offset-cal:
    $ref: /schemas/types.yaml#/definitions/int32

  siliconmitus,temp-poff:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description:
      Voltage threshold and hysteresis (in mV) for the power-off protection
      at normal and at low temperature

  siliconmitus,ext-temp-cal:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 8
    maxItems: 8
    description:
      High temperature enable, denominator, charging factor and discharging
      factor, followed by the same values for low temperature

  siliconmitus,min-charge-current-milliamp:
    default: 100

required:
  - compatible
  - reg
  - monitored-battery
  - siliconmitus,discharge-table
  - siliconmitus,charge-table
  - siliconmitus,q-table
  - siliconmitus,rce
  - siliconmitus,rs
  - siliconmitus,mix
  - siliconmitus,topoff-soc
  - siliconmitus,dtcd
  - siliconmitus,vit-period
  - siliconmitus,volt-cal
  - siliconmitus,curr-cal

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        fuel-gauge@71 {
            compatible = "siliconmitus,sm5703-fuel-gauge";
            reg = <0x71>;
            monitored-battery = <&battery>;

            siliconmitus,discharge-table = <0x1400 0x1b67 0x1cdd 0x1d6f
                                            0x1d8b 0x1de2 0x1e32 0x1e63
                                            0x1eab 0x1edf 0x1f06 0x1f54
                                            0x1fc5 0x20a0 0x2261 0x2399>;
            siliconmitus,charge-table = <0x1400 0x1b67 0x1cdd 0x1d6f
                                         0x1d8b 0x1de2 0x1e32 0x1e63
                                         0x1eab 0x1edf 0x1f06 0x1f54
                                         0x1fc5 0x20a0 0x2261 0x2399>;
            siliconmitus,q-table = <0x00 0x35 0xbf 0x144
                                    0x2d9 0x3e9 0x602 0x821
                                    0xa3b 0xb4b 0xbd5 0xc5a
                                    0xdef 0x1093 0x14cc 0x14dc>;
            siliconmitus,rce = <0x0749 0x0580 0x371>;
            siliconmitus,rs = <0x1ae 0x47a 0x3800 0x00a4>;
            siliconmitus,mix = <0x0503 0x0004>;
            siliconmitus,topoff-soc = <0x0 0x5>;
            siliconmitus,dtcd = <0x1>;
            siliconmitus,vit-period = <0x350a>;
            siliconmitus,volt-cal = <0x809e>;
            siliconmitus,curr-cal = <0x7185>;
        };
    };
